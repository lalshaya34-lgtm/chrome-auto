<body>

<div class="app">

    <div class="title">⚡ G Clicker</div>

    <div class="subtitle">
        Fast browser clicker
    </div>

    <div class="status">
        Status:
        <span id="status">OFF</span>
    </div>

    <div class="cps">

        <div id="cpsValue">10</div>

        <div class="label">
            CLICKS PER SECOND
        </div>

        <input
            id="cpsSlider"
            type="range"
            min="1"
            max="1000"
            value="10"
        >

        <input
            id="cpsInput"
            type="number"
            min="1"
            max="1000"
            value="10"
        >

    </div>

    <div class="presets">

        <button class="preset" data-cps="1">1</button>
        <button class="preset" data-cps="10">10</button>
        <button class="preset" data-cps="50">50</button>
        <button class="preset" data-cps="100">100</button>

    </div>

    <button id="toggle" class="main-button">
        START
    </button>

    <button id="test" class="test-button">
        TEST CLICK
    </button>

    <div class="stats">

        <div class="stat">
            <div id="clicks" class="stat-number">0</div>
            <div class="stat-label">TOTAL CLICKS</div>
        </div>

        <div class="stat">
            <div id="actualCps" class="stat-number">0</div>
            <div class="stat-label">CURRENT CPS</div>
        </div>

    </div>

    <div class="shortcut">
        Press <kbd>G</kbd> to start / stop
    </div>

</div>

<script>

let running = false;
let timer = null;

let totalClicks = 0;
let clicksThisSecond = 0;

const status = document.getElementById("status");
const toggle = document.getElementById("toggle");

const cpsSlider = document.getElementById("cpsSlider");
const cpsInput = document.getElementById("cpsInput");
const cpsValue = document.getElementById("cpsValue");

const clicksDisplay = document.getElementById("clicks");
const actualCpsDisplay = document.getElementById("actualCps");

const testButton = document.getElementById("test");

function getCPS() {

    let value = Number(cpsInput.value);

    if (!Number.isFinite(value)) {
        value = 10;
    }

    return Math.max(1, Math.min(1000, Math.round(value)));
}

function setCPS(value) {

    value = Math.max(1, Math.min(1000, Math.round(Number(value))));

    cpsSlider.value = value;
    cpsInput.value = value;
    cpsValue.textContent = value;

    if (running) {
        restart();
    }
}

function performClick() {

    totalClicks++;
    clicksThisSecond++;

    clicksDisplay.textContent =
        totalClicks.toLocaleString();

    /*
      This generates the click inside this webpage.
    */
    testButton.dispatchEvent(
        new MouseEvent("click", {
            bubbles: true,
            cancelable: true
        })
    );
}

function start() {

    if (running) return;

    running = true;

    status.textContent = "ON";
    status.classList.add("on");

    toggle.textContent = "STOP";
    toggle.classList.add("running");

    const cps = getCPS();

    /*
      Browsers limit timer precision at very high speeds.
      The requested CPS is still used as the target.
    */
    const interval = Math.max(1, 1000 / cps);

    timer = setInterval(performClick, interval);
}

function stop() {

    running = false;

    clearInterval(timer);
    timer = null;

    status.textContent = "OFF";
    status.classList.remove("on");

    toggle.textContent = "START";
    toggle.classList.remove("running");

    actualCpsDisplay.textContent = "0";
}

function restart() {

    if (!running) return;

    stop();
    start();
}

function toggleClicker() {

    if (running) {
        stop();
    } else {
        start();
    }
}

toggle.addEventListener("click", toggleClicker);

testButton.addEventListener("click", function() {
    // Test button itself doesn't start the clicker.
});

cpsSlider.addEventListener("input", function() {
    setCPS(this.value);
});

cpsInput.addEventListener("change", function() {
    setCPS(this.value);
});

document.querySelectorAll(".preset").forEach(function(button) {

    button.addEventListener("click", function() {
        setCPS(this.dataset.cps);
    });

});

/* G = start / stop */
document.addEventListener("keydown", function(event) {

    if (
        event.key.toLowerCase() === "g" &&
        document.activeElement !== cpsInput
    ) {
        event.preventDefault();
        toggleClicker();
    }

});

/* Measure actual browser click rate */
setInterval(function() {

    actualCpsDisplay.textContent = clicksThisSecond;

    clicksThisSecond = 0;

}, 1000);

</script>

</body>
</html>
