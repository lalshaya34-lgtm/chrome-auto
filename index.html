<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G Auto Clicker</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #111827, #312e81);
        font-family: Arial, sans-serif;
        color: white;
    }

    .app {
        width: 90%;
        max-width: 400px;
        padding: 30px;
        background: rgba(255,255,255,0.1);
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 15px 40px rgba(0,0,0,0.4);
    }

    h1 {
        margin-top: 0;
    }

    #status {
        font-size: 22px;
        font-weight: bold;
        color: #ff5555;
    }

    #status.on {
        color: #4ade80;
    }

    input {
        width: 100%;
        padding: 12px;
        margin: 15px 0;
        border: none;
        border-radius: 10px;
        font-size: 18px;
        text-align: center;
    }

    #clickButton {
        width: 100%;
        padding: 20px;
        border: none;
        border-radius: 12px;
        background: #4f46e5;
        color: white;
        font-size: 22px;
        font-weight: bold;
        cursor: pointer;
    }

    #clickButton:hover {
        background: #6366f1;
    }

    .info {
        margin-top: 20px;
        color: #d1d5db;
    }

    .key {
        display: inline-block;
        padding: 5px 10px;
        background: #111827;
        border-radius: 6px;
        font-weight: bold;
        color: white;
    }
</style>
</head>

<body>

<div class="app">

    <h1>⚡ G Auto Clicker</h1>

    <p>
        Status:
        <span id="status">OFF</span>
    </p>

    <label>
        Click interval (milliseconds)
    </label>

    <input
        id="speed"
        type="number"
        value="100"
        min="10"
        step="10"
    >

    <button id="clickButton">
        CLICK ME
    </button>

    <div class="info">
        Press <span class="key">G</span> to turn ON/OFF
    </div>

    <p>
        Clicks: <span id="clickCount">0</span>
    </p>

</div>

<script>

let running = false;
let timer = null;
let clicks = 0;

const button = document.getElementById("clickButton");
const status = document.getElementById("status");
const speed = document.getElementById("speed");
const clickCount = document.getElementById("clickCount");

function startClicker() {

    if (running) return;

    running = true;

    status.textContent = "ON";
    status.classList.add("on");

    let interval = Number(speed.value);

    if (interval < 10) {
        interval = 10;
        speed.value = 10;
    }

    timer = setInterval(function() {
        button.click();
    }, interval);
}

function stopClicker() {

    running = false;

    clearInterval(timer);
    timer = null;

    status.textContent = "OFF";
    status.classList.remove("on");
}

function toggleClicker() {

    if (running) {
        stopClicker();
    } else {
        startClicker();
    }
}

/* Count clicks */
button.addEventListener("click", function() {

    clicks++;

    clickCount.textContent = clicks;

});

/* G key = ON/OFF */
document.addEventListener("keydown", function(event) {

    if (
        event.key.toLowerCase() === "g" &&
        document.activeElement !== speed
    ) {
        toggleClicker();
    }

});

/* Update speed while running */
speed.addEventListener("change", function() {

    if (running) {
        stopClicker();
        startClicker();
    }

});

</script>

</body>
</html>
