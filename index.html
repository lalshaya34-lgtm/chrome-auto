<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Auto Clicker</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111827;
        color: #f8fafc;
        font-family: Arial, sans-serif;
    }

    .app {
        width: min(650px, 94%);
        margin: 30px auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 20px;
    }

    .panel {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 14px;
        padding: 20px;
        margin-bottom: 16px;
    }

    .row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 12px 0;
    }

    label {
        min-width: 160px;
        font-weight: bold;
    }

    input,
    select {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #4b5563;
        background: #111827;
        color: white;
        font-size: 16px;
    }

    input[type="number"] {
        max-width: 180px;
    }

    button {
        padding: 11px 20px;
        border: 0;
        border-radius: 8px;
        background: #4f46e5;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        background: #6366f1;
    }

    .stop {
        background: #dc2626;
    }

    .stop:hover {
        background: #ef4444;
    }

    .reset {
        background: #475569;
    }

    .status {
        text-align: center;
        font-size: 20px;
        font-weight: bold;
        color: #ef4444;
    }

    .status.on {
        color: #22c55e;

    .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 15px;

    #testArea {

    }
</style>
</head>

<body>

<div class="app">

    <h1>🖱️ My Auto Clicker</h1>

    <div class="panel">

        <div id="status" class="status">
            ● OFF
        </div>

        <div class="row">
            <label for="cps">Clicks Per Second</label>

            <input
                id="cps"
                type="number"
                min="1"
                max="1000"
                value="10"
            >
        </div>

        <div class="row">
            <label for="buttonType">Mouse Button</label>

            <select id="buttonType">
                <option value="left">Left</option>
                <option value="right">Right</option>
                <option value="middle">Middle</option>
            </select>
        </div>

        <div class="row">
            <label for="clickType">Click Type</label>

            <select id="clickType">
                <option value="single">Single Click</option>
                <option value="double">Double Click</option>
            </select>
        </div>

        <div class="buttons">

            <button id="start">
                START
            </button>

            <button id="stop" class="stop">
                STOP
            </button>

            <button id="reset" class="reset">
                RESET
            </button>

        </div>

        <div class="stats">

            <div class="stat">
                Clicks
                <span
                    id="clickCount"
                    class="number"
                >0</span>
            </div>

            <div class="stat">
                CPS
                <span
                    id="currentCps"
                    class="number"
                >10</span>
            </div>

        </div>

        <p class="help">
            Press <strong>G</strong> to start or stop.
            Don't press G while typing in the CPS box.
        </p>

    </div>

    <div class="panel">

        <h2>Test Area</h2>

        <p class="help">
            This is the area the browser version can click.
        </p>

        <div id="testArea">

            <button
                id="target"
                aria-label="Click target"
            ></button>

        </div>

    </div>

</div>


<script>

const cpsInput =
    document.getElementById("cps");

const buttonType =
    document.getElementById("buttonType");

const clickType =
    document.getElementById("clickType");

const startButton =
    document.getElementById("start");

const stopButton =
    document.getElementById("stop");

const resetButton =
    document.getElementById("reset");

const status =
    document.getElementById("status");

const clickCount =
    document.getElementById("clickCount");

const currentCps =
    document.getElementById("currentCps");

const testArea =
    document.getElementById("testArea");

const target =
    document.getElementById("target");


let running = false;
let timer = null;
let clicks = 0;


/* Get CPS between 1 and 1000 */

function getCPS() {

    let value =
        Number(cpsInput.value);

    if (!Number.isFinite(value)) {
        value = 10;
    }

    value =
        Math.round(
            Math.max(
                1,
                Math.min(
                    1000,
                    value
                )
            )
        );

    cpsInput.value = value;

    currentCps.textContent = value;

    return value;
}


/* Move target */

function moveTarget() {

    const padding = 10;

    const maxX =
        testArea.clientWidth -
        target.offsetWidth -
        padding;

    const maxY =
        testArea.clientHeight -
        target.offsetHeight -
        padding;

    target.style.left =
        (
            padding +
            Math.random() *
            Math.max(0, maxX - padding)
        ) + "px";

    target.style.top =
        (
            padding +
            Math.random() *
            Math.max(0, maxY - padding)
        ) + "px";
}


/* Actual test click */

target.addEventListener(
    "click",
    function(event) {

        clicks++;

        clickCount.textContent =
            clicks.toLocaleString();

        moveTarget();

    }
);


/* Generate a browser click */

function doClick() {

    const button =
        buttonType.value;

    let mouseButton = 0;

    if (button === "right") {
        mouseButton = 2;
    }

    if (button === "middle") {
        mouseButton = 1;
    }

    const eventOptions = {
        bubbles: true,
        cancelable: true,
        view: window,
        button: mouseButton,
        buttons: 0,
        clientX:
            target.getBoundingClientRect().left +
            target.offsetWidth / 2,
        clientY:
            target.getBoundingClientRect().top +
            target.offsetHeight / 2
    };


    if (clickType.value === "double") {

        target.dispatchEvent(
            new MouseEvent(
                "dblclick",
                eventOptions
            )
        );

        clicks += 2;

    } else {

        target.dispatchEvent(
            new MouseEvent(
                "click",
                eventOptions
            )
        );

    }

    clickCount.textContent =
        clicks.toLocaleString();

}


/* Start */

function start() {

    if (running) {
        return;
    }

    const cps = getCPS();

    running = true;

    status.textContent =
        "● ON";

    status.classList.add("on");

    timer =
        setInterval(
            doClick,
            Math.max(
                1,
                1000 / cps
            )
        );
}


/* Stop */

function stop() {

    running = false;

    if (timer !== null) {

        clearInterval(timer);

        timer = null;
    }

    status.textContent =
        "● OFF";

    status.classList.remove("on");
}


/* Reset */

function reset() {

    stop();

    clicks = 0;

    clickCount.textContent =
        "0";

    moveTarget();
}


/* Buttons */

startButton.onclick = start;

stopButton.onclick = stop;

resetButton.onclick = reset;


/* Update CPS display */

cpsInput.addEventListener(
    "input",
    getCPS
);


/* G keyboard shortcut */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "g" ||
            event.key === "G"
        ) {

            if (
                event.target.tagName === "INPUT" ||
                event.target.tagName === "TEXTAREA"
            ) {
                return;
            }

            event.preventDefault();

            if (running) {
                stop();
            } else {
                start();
            }

        }

    }
);


/* Initial target position */

moveTarget();

</script>

</body>
</html>
