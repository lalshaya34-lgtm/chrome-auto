
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chromebook Auto Clicker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
    }

    .app {
      width: 90%;
      max-width: 420px;
      padding: 28px;
      border-radius: 20px;
      background: #1e293b;
      box-shadow: 0 10px 40px #0006;
      text-align: center;
    }

    h1 {
      margin-top: 0;
      color: #60a5fa;
    }

    .status {
      margin: 20px 0;
      padding: 12px;
      border-radius: 10px;
      background: #334155;
      font-weight: bold;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      text-align: left;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
    }

    input[type="range"] {
      padding: 0;
      accent-color: #60a5fa;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      filter: brightness(1.12);
    }

    #start {
      background: #22c55e;
      color: #052e16;
    }

    #stop {
      background: #ef4444;
      color: white;
    }

    #test {
      background: #3b82f6;
      color: white;
    }

    .counter {
      font-size: 32px;
      font-weight: bold;
      margin: 18px 0;
    }

    .note {
      color: #cbd5e1;
      font-size: 12px;
      line-height: 1.5;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <main class="app">
    <h1>⚡ Auto Clicker</h1>
    <p>Chromebook & Chrome</p>

    <div class="status" id="status">
      Status: Stopped
    </div>

    <label for="speed">
      Click interval: <span id="speedText">100 ms</span>
    </label>
    <input
      id="speed"
      type="range"
      min="10"
      max="2000"
      step="10"
      value="100"
    >

    <label for="mode">Click button</label>
    <select id="mode">
      <option value="left">Left click</option>
      <option value="right">Right click (test area only)</option>
    </select>

    <button id="start">▶ Start Auto Clicker</button>
    <button id="stop">■ Stop Auto Clicker</button>

    <div class="counter" id="counter">0</div>
    <div>Clicks performed</div>

    <h3>Test Area</h3>
    <button id="test">Click Me to Test</button>

    <p class="note">
      This webpage can only generate clicks inside its own test area.
      Chrome webpages cannot automatically click other tabs, other
      websites, or Chromebook system controls.
    </p>
  </main>

  <script>
    const speed = document.getElementById("speed");
    const speedText = document.getElementById("speedText");
    const status = document.getElementById("status");
    const counter = document.getElementById("counter");
    const start = document.getElementById("start");
    const stop = document.getElementById("stop");
    const test = document.getElementById("test");
    const mode = document.getElementById("mode");

    let timer = null;
    let clicks = 0;

    speed.addEventListener("input", () => {
      speedText.textContent = speed.value + " ms";

      if (timer !== null) {
        runClicker();
      }
    });

    function performClick() {
      const button = mode.value === "right" ? 2 : 0;

      const event = new MouseEvent("click", {
        bubbles: true,
        cancelable: true,
        view: window,
        button: button
      });

      test.dispatchEvent(event);
    }

    function runClicker() {
      clearInterval(timer);

      timer = setInterval(() => {
        performClick();
      }, Number(speed.value));

      status.textContent = "Status: Running";
      status.style.color = "#86efac";
    }

    start.addEventListener("click", () => {
      if (timer !== null) return;

      runClicker();
    });

    stop.addEventListener("click", () => {
      clearInterval(timer);
      timer = null;

      status.textContent = "Status: Stopped";
      status.style.color = "white";
    });

    test.addEventListener("click", () => {
      clicks++;
      counter.textContent = clicks;
    });

    test.addEventListener("contextmenu", (event) => {
      event.preventDefault();
    });
  </script>
</body>
</html>
