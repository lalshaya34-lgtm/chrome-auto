```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mouse Clicker Test</title>

<style>
    body {
        margin: 0;
        min-height: 100vh;
        background: #101827;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .panel {
        padding: 25px;
    }

    button, input {
        font-size: 18px;
        padding: 12px;
        margin: 6px;
        border-radius: 8px;
    }

    button {
        border: 0;
        cursor: pointer;
        background: #4f46e5;
        color: white;
        font-weight: bold;
    }

    #game {
        position: relative;
        height: 450px;
        margin: 20px;
        border: 3px solid #4f46e5;
        border-radius: 15px;
        background: #182235;
        overflow: hidden;
    }

    #target {
        position: absolute;
        width: 70px;
        height: 70px;
        border-radius: 50%;
        background: #22c55e;
        border: 0;
    }

    #target:active {
        background: #16a34a;
    }

    #status {
        color: #ef4444;
        font-weight: bold;
    }

    #status.on {
        color: #22c55e;
    }
</style>
</head>

<body>

<div class="panel">

    <h1>🖱️ Auto Clicker Test</h1>

    <p>
        Status:
        <span id="status">OFF</span>
    </p>

    <p>
        CPS:
        <input
            id="cps"
            type="number"
            min="1"
            max="1000"
            value="10"
        >
    </p>

    <button id="start">START</button>

    <p>
        Clicks:
        <strong id="count">0</strong>
    </p>

    <p>
        Press <strong>G</strong> to start/stop.
    </p>

</div>

<div id="game">
    <button id="target"></button>
</div>

<script>

const startButton = document.getElementById("start");
const status = document.getElementById("status");
const cpsInput = document.getElementById("cps");
const target = document.getElementById("target");
const countDisplay = document.getElementById("count");
const game = document.getElementById("game");

let running = false;
let timer = null;
let count = 0;


/* Put the target somewhere random */

function moveTarget() {

    const maxX =
        game.clientWidth - target.offsetWidth;

    const maxY =
        game.clientHeight - target.offsetHeight;

    target.style.left =
        Math.random() * maxX + "px";

    target.style.top =
        Math.random() * maxY + "px";
}


/* The game's real click handler */

target.addEventListener("click", function() {

    count++;

    countDisplay.textContent =
        count.toLocaleString();

    moveTarget();

});


/* Get CPS safely */

function getCPS() {

    let value =
        Number(cpsInput.value);

    if (!Number.isFinite(value)) {
        value = 10;
    }

    return Math.max(
        1,
        Math.min(1000, Math.round(value))
    );
}


/* Start */

function start() {

    if (running) return;

    running = true;

    status.textContent = "ON";
    status.classList.add("on");

    startButton.textContent = "STOP";

    const delay =
        Math.max(1, 1000 / getCPS());

    /*
       IMPORTANT:
       This dispatches a click ONLY to
       the target inside this webpage.
    */

    timer = setInterval(function() {

        target.dispatchEvent(
            new MouseEvent("click", {
                bubbles: true,
                cancelable: true,
                view: window
            })
        );

    }, delay);
}


/* Stop */

function stop() {

    running = false;

    clearInterval(timer);

    timer = null;

    status.textContent = "OFF";
    status.classList.remove("on");

    startButton.textContent = "START";
}


/* Toggle */

function toggle() {

    if (running) {
        stop();
    } else {
        start();
    }
}


/* Button */

startButton.addEventListener(
    "click",
    toggle
);


/* G shortcut */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "g" ||
            event.key === "G"
        ) {

            event.preventDefault();

            toggle();
        }

    }
);


/* Initial position */

moveTarget();

</script>

</body>
</html>
