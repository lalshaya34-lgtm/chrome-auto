```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#080b14">

<title>G Clicker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #080b14;
    color: white;
    font-family: Arial, sans-serif;
}

.app {
    width: 92%;
    max-width: 450px;
    background: #111827;
    padding: 30px;
    border-radius: 24px;
    box-shadow: 0 20px 60px #0008;
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #9ca3af;
    margin: 8px 0 25px;
}

.status {
    text-align: center;
    background: #0f172a;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 25px;
}

#status {
    color: #ef4444;
    font-weight: bold;
}

#status.on {
    color: #22c55e;
}

.cps-display {
    text-align: center;
}

#cpsNumber {
    font-size: 60px;
    font-weight: bold;
    color: #818cf8;
}

.cps-label {
    color: #9ca3af;
}

#slider {
    width: 100%;
    margin: 25px 0;
    accent-color: #6366f1;
}

#cpsInput {
    width: 100%;
    padding: 14px;
    border: 1px solid #374151;
    border-radius: 10px;
    background: #0f172a;
    color: white;
    font-size: 18px;
    text-align: center;
}

button {
    width: 100%;
    border: 0;
    border-radius: 12px;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

#startButton {
    margin-top: 20px;
    padding: 18px;
    background: #4f46e5;
    font-size: 20px;
}

#startButton.running {
    background: #dc2626;
}

#testButton {
    margin-top: 10px;
    padding: 13px;
    background: #374151;
}

.presets {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 12px;
}

.preset {
    padding: 10px;
    background: #374151;
}

.stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 20px;
}

.stat {
    background: #0f172a;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
}

.stat-number {
    font-size: 24px;
    font-weight: bold;
}

.stat-label {
    color: #9ca3af;
    font-size: 12px;
    margin-top: 4px;
}

.help {
    text-align: center;
    margin-top: 20px;
    color: #9ca3af;
}

kbd {
    background: #374151;
    padding: 5px 10px;
    border-radius: 6px;
    color: white;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

    <h1>⚡ G Clicker</h1>

    <div class="subtitle">
        1–1000 CPS
    </div>

    <div class="status">
        Status:
        <span id="status">OFF</span>
    </div>

    <div class="cps-display">

        <div id="cpsNumber">10</div>

        <div class="cps-label">
            CLICKS PER SECOND
        </div>

    </div>

    <input
        id="slider"
        type="range"
        min="1"
        max="1000"
        value="10"
    >

    <input
        id="cpsInput"
        type="number"
        min="1"
        max="1000"
        value="10"
    >

    <div class="presets">
        <button class="preset" data-value="1">1</button>
        <button class="preset" data-value="10">10</button>
        <button class="preset" data-value="50">50</button>
        <button class="preset" data-value="100">100</button>
    </div>

    <button id="startButton">
        START
    </button>

    <button id="testButton">
        TEST CLICK
    </button>

    <div class="stats">

        <div class="stat">
            <div id="totalClicks" class="stat-number">0</div>
            <div class="stat-label">TOTAL CLICKS</div>
        </div>

        <div class="stat">
            <div id="actualCps" class="stat-number">0</div>
            <div class="stat-label">ACTUAL CPS</div>
        </div>

    </div>

    <div class="help">
        Press <kbd>G</kbd> to START / STOP
    </div>

</div>

<script>

let running = false;
let timer = null;

let totalClicks = 0;
let clicksThisSecond = 0;

const status = document.getElementById("status");
const startButton = document.getElementById("startButton");

const slider = document.getElementById("slider");
const cpsInput = document.getElementById("cpsInput");
const cpsNumber = document.getElementById("cpsNumber");

const totalClicksDisplay = document.getElementById("totalClicks");
const actualCpsDisplay = document.getElementById("actualCps");

function getCPS() {

    let cps = parseInt(cpsInput.value);

    if (isNaN(cps)) {
        cps = 10;
    }

    cps = Math.max(1, Math.min(1000, cps));

    return cps;
}

function setCPS(value) {

    value = Math.max(
        1,
        Math.min(1000, parseInt(value) || 1)
    );

    slider.value = value;
    cpsInput.value = value;
    cpsNumber.textContent = value;

    if (running) {
        stop();
        start();
    }
}

function doClick() {

    totalClicks++;
    clicksThisSecond++;

    totalClicksDisplay.textContent =
        totalClicks.toLocaleString();

    /*
      This creates the click inside the app.
    */
    document.getElementById("testButton").click();
}

function start() {

    if (running) return;

    running = true;

    status.textContent = "ON";
    status.classList.add("on");

    startButton.textContent = "STOP";
    startButton.classList.add("running");

    const cps = getCPS();

    const interval = Math.max(
        1,
        1000 / cps
    );

    timer = setInterval(
        doClick,
        interval
    );
}

function stop() {

    running = false;

    clearInterval(timer);

    timer = null;

    status.textContent = "OFF";
    status.classList.remove("on");

    startButton.textContent = "START";
    startButton.classList.remove("running");

    actualCpsDisplay.textContent = "0";
}

function toggle() {

    if (running) {
        stop();
    } else {
        start();
    }
}

/* START / STOP button */

startButton.addEventListener(
    "click",
    toggle
);

/* CPS slider */

slider.addEventListener(
    "input",
    function() {
        setCPS(this.value);
    }
);

/* CPS number box */

cpsInput.addEventListener(
    "change",
    function() {
        setCPS(this.value);
    }
);

/* Presets */

document.querySelectorAll(
    ".preset"
).forEach(function(button) {

    button.addEventListener(
        "click",
        function() {
            setCPS(this.dataset.value);
        }
    );

});

/*
   G KEY
   Works anywhere while this webpage/app
   is open and focused.
*/

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "g" ||
            event.key === "G"
        ) {

            event.preventDefault();

            toggle();
        }

    }
);

/* Actual CPS counter */

setInterval(
    function() {

        actualCpsDisplay.textContent =
            clicksThisSecond;

        clicksThisSecond = 0;

    },
    1000
);

/* PWA service worker */

if ("serviceWorker" in navigator) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker.register(
                "./sw.js"
            );

        }
    );

}

</script>

</body>
</html>
