<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G Auto Clicker</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #101827;
    color: white;
    display: flex;
    justify-content: center;
}

.container {
    width: min(700px, 94%);
    margin-top: 35px;
}

h1 {
    text-align: center;
}

.card {
    background: #182235;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #0f172a;
    color: white;
    font-size: 18px;
}

button {
    padding: 13px 20px;
    border: 0;
    border-radius: 9px;
    background: #4f46e5;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #6366f1;
}

#stop {
    background: #dc2626;
}

#stop:hover {
    background: #ef4444;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 15px;
}

.info {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 15px;
}

.stat {
    background: #0f172a;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

.stat-number {
    display: block;
    font-size: 25px;
    font-weight: bold;
    margin-top: 5px;
}

#status {
    color: #ef4444;
}

#status.on {
    color: #22c55e;
}

#testArea {
    position: relative;
    height: 350px;
    border: 3px solid #4f46e5;
    border-radius: 15px;
    background: #0f172a;
    overflow: hidden;
}

#target {
    position: absolute;
    width: 65px;
    height: 65px;
    border-radius: 50%;
    background: #22c55e;
    border: 0;
    cursor: pointer;
    padding: 0;
}

#target:hover {
    background: #16a34a;
}

.help {
    color: #94a3b8;
    line-height: 1.5;
}
</style>
</head>

<body>

<div class="container">

    <h1>🖱️ G Auto Clicker</h1>

    <div class="card">

        <label for="cps">Clicks Per Second (1–1000)</label>

        <input
            id="cps"
            type="number"
            min="1"
            max="1000"
            value="10"
        >

        <div class="controls">

            <button id="start">
                START
            </button>

            <button id="stop">
                STOP
            </button>

        </div>

        <div class="info">

            <div class="stat">
                Status
                <span
                    id="status"
                    class="stat-number"
                >
                    OFF
                </span>
            </div>

            <div class="stat">
                Clicks
                <span
                    id="clickCount"
                    class="stat-number"
                >
                    0
                </span>
            </div>

        </div>

        <p class="help">
            Press <strong>G</strong> to start or stop the
            auto-clicker. The page must be focused.
        </p>

    </div>

    <div class="card">

        <h2>Test Area</h2>

        <p class="help">
            The green button is the target for this webpage.
        </p>

        <div id="testArea">

            <button
                id="target"
                aria-label="Click target"
            >
            </button>

        </div>

    </div>

</div>

<script>

const cpsInput = document.getElementById("cps");
const startButton = document.getElementById("start");
const stopButton = document.getElementById("stop");
const statusText = document.getElementById("status");
const clickCount = document.getElementById("clickCount");
const target = document.getElementById("target");
const testArea = document.getElementById("testArea");

let running = false;
let timer = null;
let clicks = 0;


/* Get a valid CPS value */

function getCPS() {

    let cps = Number(cpsInput.value);

    if (!Number.isFinite(cps)) {
        cps = 10;
    }

    cps = Math.round(cps);

    cps = Math.max(1, Math.min(1000, cps));

    cpsInput.value = cps;

    return cps;
}


/* Move the test target */

function moveTarget() {

    const padding = 10;

    const maxX =
        testArea.clientWidth -
        target.offsetWidth -
        padding;

    const maxY =
        testArea.clientHeight -
        target.offsetHeight -
        padding;

    const x =
        padding +
        Math.random() *
        Math.max(0, maxX - padding);

    const y =
        padding +
        Math.random() *
        Math.max(0, maxY - padding);

    target.style.left = x + "px";
    target.style.top = y + "px";
}


/* What happens when the target is clicked */

target.addEventListener("click", function() {

    clicks++;

    clickCount.textContent =
        clicks.toLocaleString();

    moveTarget();

});


/* Start */

function startClicker() {

    if (running) {
        return;
    }

    const cps = getCPS();

    running = true;

    statusText.textContent = "ON";
    statusText.classList.add("on");

    timer = setInterval(function() {

        target.dispatchEvent(
            new MouseEvent("click", {
                bubbles: true,
                cancelable: true,
                view: window
            })
        );

    }, Math.max(1, 1000 / cps));

}


/* Stop */

function stopClicker() {

    running = false;

    if (timer !== null) {
        clearInterval(timer);
        timer = null;
    }

    statusText.textContent = "OFF";
    statusText.classList.remove("on");
}


/* Buttons */

startButton.addEventListener(
    "click",
    startClicker
);

stopButton.addEventListener(
    "click",
    stopClicker
);


/* G keyboard shortcut */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "g" ||
            event.key === "G"
        ) {

            /*
             Don't trigger G while
             typing in the CPS box.
            */

            if (
                event.target.tagName === "INPUT" ||
                event.target.tagName === "TEXTAREA"
            ) {
                return;
            }

            event.preventDefault();

            if (running) {
                stopClicker();
            } else {
                startClicker();
            }

        }

    }
);


/* Start with target in a random position */

moveTarget();

</script>

</body>
</html>
