<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G Clicker</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #090d18;

    }

    .app {
        width: 92%;
        max-width: 430px;
        padding: 30px;

        border-radius: 22px;

        box-shadow: 0 20px 60px #0008;
    }

    h1 {
        margin: 0;
        font-size: 34px;
    }

    .subtitle {
        color: #9ca3af;

    .status {

        color: #ef4444;

        color: #22c55e;

        color: #9ca3af;

    #slider {
        width: 100%;

    }

    #number {
        width: 100%;
        padding: 13px;
        border: 1px solid #374151;

    }

    #start {
        width: 100%;

        font-weight: bold;

    }

    #start.running {
        background: #dc2626;
    }

    #test {
        width: 100%;
        margin-top: 10px;

        border: 0;
        border-radius: 12px;
        background: #374151;
        color: white;
        cursor: pointer;
    }

    .counter {
        margin-top: 20px;
        padding: 15px;
        background: #0c1220;
        border-radius: 12px;
    }

    .hint {
        margin-top: 20px;

    }

        padding: 5px 10px;
        background: #374151;
        border-radius: 6px;
        color: white;
        font-weight: bold;
    }

    #keyMessage {
        height: 20px;
        margin-top: 10px;
        color: #818cf8;
        font-size: 13px;
    }
</style>
</head>

<body>

<div class="app">

    <h1>⚡ G Clicker</h1>

    <div class="subtitle">
        1–1000 CPS
    </div>

    <div class="status">
        Status:
        <span id="status">OFF</span>
    </div>

    <div id="cps">10</div>

    <div class="label">
        CLICKS PER SECOND
    </div>

    <input
        id="slider"
        type="range"
        min="1"
        max="1000"
        value="10"
    >

    <input
        id="number"
        type="number"
        min="1"
        max="1000"
        value="10"
    >

    <button id="start">
        START
    </button>

    <button id="test">
        TEST CLICK
    </button>

    <div class="counter">
        Clicks: <b id="count">0</b>
    </div>

    <div class="hint">
        Press <kbd>G</kbd> to start / stop
    </div>

    <div id="keyMessage"></div>

</div>

<script>

let running = false;
let timer = null;
let count = 0;

const statusText = document.getElementById("status");
const startButton = document.getElementById("start");
const testButton = document.getElementById("test");

const slider = document.getElementById("slider");
const number = document.getElementById("number");

const cpsDisplay = document.getElementById("cps");
const countDisplay = document.getElementById("count");
const keyMessage = document.getElementById("keyMessage");


/* Get CPS */

function getCPS() {

    let value = Number(number.value);

    if (!Number.isFinite(value)) {
        value = 10;
    }

    return Math.max(
        1,
        Math.min(1000, Math.round(value))
    );
}


/* Change CPS */

function setCPS(value) {

    value = Math.max(
        1,
        Math.min(1000, Math.round(Number(value)))
    );

    slider.value = value;
    number.value = value;
    cpsDisplay.textContent = value;

    if (running) {
        stop();
        start();
    }
}


/* The click */

function clickOnce() {

    count++;

    countDisplay.textContent =
        count.toLocaleString();

    /*
      This is a click generated inside
      the webpage.
    */
    testButton.dispatchEvent(
        new MouseEvent("click", {
            bubbles: true
        })
    );
}


/* Start */

function start() {

    if (running) return;

    running = true;

    statusText.textContent = "ON";
    statusText.classList.add("on");

    startButton.textContent = "STOP";
    startButton.classList.add("running");

    const cps = getCPS();

    const delay = Math.max(
        1,
        1000 / cps
    );

    timer = setInterval(
        clickOnce,
        delay
    );
}


/* Stop */

function stop() {

    running = false;

    clearInterval(timer);

    timer = null;

    statusText.textContent = "OFF";
    statusText.classList.remove("on");

    startButton.textContent = "START";
    startButton.classList.remove("running");
}


/* Toggle */

function toggle() {

    if (running) {
        stop();
    } else {
        start();
    }
}


/* Button */

startButton.addEventListener(
    "click",
    toggle
);


/* Slider */

slider.addEventListener(
    "input",
    function() {
        setCPS(this.value);
    }
);


/* Number */

number.addEventListener(
    "change",
    function() {
        setCPS(this.value);
    }
);


/*
   G KEY

   keydown is attached to the entire
   webpage, so it doesn't matter where
   you clicked on the page.
*/

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "g" ||
            event.key === "G"
        ) {

            event.preventDefault();

            keyMessage.textContent =
                "G detected!";

            toggle();

            setTimeout(
                function() {
                    keyMessage.textContent = "";
                },
                700
            );
        }

    }
);

</script>

</body>
</html>
