```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>G Auto Clicker</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#111827">

<style>
body {
    margin: 0;
    background: #111827;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.container {
    max-width: 600px;
    margin: 40px auto;
    padding: 20px;
}

.card {
    background: #1f2937;
    border-radius: 16px;
    padding: 25px;
}

input {
    width: 100%;
    padding: 12px;
    box-sizing: border-box;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #111827;
    color: white;
    font-size: 18px;
}

button {
    padding: 13px 20px;
    margin: 8px 4px;
    border: 0;
    border-radius: 9px;
    background: #4f46e5;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

#status {
    color: #ef4444;
    font-weight: bold;
}

#status.on {
    color: #22c55e;
}

#mouseArea {
    height: 250px;
    margin-top: 20px;
    border: 2px solid #6366f1;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}

#mouseArea.locked {
    background: #172554;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>🖱️ G Auto Clicker</h1>

<p>
Status:
<span id="status">OFF</span>
</p>

<label>
CPS (1–1000)
</label>

<br><br>

<input
    id="cps"
    type="number"
    min="1"
    max="1000"
    value="10"
>

<br>

<button id="start">
START
</button>

<button id="stop">
STOP
</button>

<button id="mouse">
USE MOUSE
</button>

<p>
Clicks:
<strong id="count">0</strong>
</p>

<div id="mouseArea">
    Click <b>USE MOUSE</b> to test mouse access.
</div>

<p>
Press <b>G</b> to start/stop.
</p>

</div>

</div>

<script>

const cpsInput =
    document.getElementById("cps");

const startButton =
    document.getElementById("start");

const stopButton =
    document.getElementById("stop");

const mouseButton =
    document.getElementById("mouse");

const status =
    document.getElementById("status");

const countDisplay =
    document.getElementById("count");

const mouseArea =
    document.getElementById("mouseArea");

let running = false;
let timer = null;
let clicks = 0;


/* Get CPS */

function getCPS() {

    let value =
        Number(cpsInput.value);

    if (!Number.isFinite(value)) {
        value = 10;
    }

    value =
        Math.round(
            Math.max(
                1,
                Math.min(1000, value)
            )
        );

    cpsInput.value = value;

    return value;
}


/* Start */

function start() {

    if (running) return;

    running = true;

    status.textContent = "ON";
    status.classList.add("on");

    const cps = getCPS();

    timer = setInterval(function() {

        clicks++;

        countDisplay.textContent =
            clicks.toLocaleString();

    }, Math.max(1, 1000 / cps));
}


/* Stop */

function stop() {

    running = false;

    clearInterval(timer);

    timer = null;

    status.textContent = "OFF";
    status.classList.remove("on");
}


/* Buttons */

startButton.onclick = start;

stopButton.onclick = stop;


/* G shortcut */

document.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "g" ||
            event.key === "G"
        ) {

            if (
                event.target.tagName === "INPUT"
            ) {
                return;
            }

            event.preventDefault();

            if (running) {
                stop();
            } else {
                start();
            }
        }
    }
);


/*
    Test Pointer Lock.

    This is the most mouse access
    a normal web app can request.
*/

mouseButton.onclick = async function() {

    try {

        await mouseArea.requestPointerLock();

        mouseArea.classList.add("locked");

        mouseArea.textContent =
            "Mouse captured. Press ESC to release it.";

    } catch (error) {

        mouseArea.textContent =
            "Chrome did not allow mouse access.";

        console.log(error);

    }

};


/* Mouse movement test */

document.addEventListener(
    "mousemove",
    function(event) {

        if (
            document.pointerLockElement === mouseArea
        ) {

            mouseArea.textContent =
                "Mouse movement detected: " +
                event.movementX +
                ", " +
                event.movementY;
        }

    }
);


/* Service worker */

if ("serviceWorker" in navigator) {

    navigator.serviceWorker.register(
        "sw.js"
    ).catch(function(error) {

        console.log(
            "Service worker:",
            error
        );

    });

}

</script>

</body>
</html>
